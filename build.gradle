plugins {
  id 'java'
  id 'maven-publish'
  id "com.github.node-gradle.node" version "7.1.0"
  id 'com.enonic.xp.base'
}

dependencies {
  implementation xplibs.api.script
  testImplementation xplibs.testing

  // XP's testing jar only exposes JUnit at runtime, and without the engine. Same JUnit version as XP 8.0.0 uses.
  testImplementation platform("org.junit:junit-bom:6.1.0")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"

  // The GraalJS language for the `testGraalJS` task. XP's testing jar only ships it from 8.1, so until then it is
  // declared here, in the version of the Graal polyglot API that XP 8.0.0 brings along.
  testRuntimeOnly "org.graalvm.polyglot:js:25.0.3"
}

// XP 8 can run either engine, so the library is tested on both. The first one is what `test` runs on,
// and the plugin adds a `testGraalJS` task for the other, which `check` depends on.
xp {
  scriptEngines = ["Nashorn", "GraalJS"]
}

// Applies to `test` and to the `testGraalJS` task the plugin adds
tasks.withType(Test).configureEach {
  useJUnitPlatform()

  // DatesTest asserts on what formatDate() gives when it falls back to the system time zone,
  // so pin the zone instead of inheriting the machine's (UTC on GitHub Actions).
  systemProperty "user.timezone", "Europe/Oslo"
}

repositories {
  // Must come before Maven Central: XP's artifacts are on both, but Central lacks the core-api test-fixtures jar
  // that com.enonic.xp:testing needs, and Gradle only looks in the first repository that has the module.
  xp.enonicRepo()
  mavenCentral()
}

node {
  download = true
  // Single source of truth for the Node version, shared with .github/workflows and nvm
  version = file(".nvmrc").text.trim()
}

processResources {
  exclude "**/.gitkeep"
  exclude "**/*.json"
  exclude "**/*.ts"
}

tasks.register("dev", Exec) {
  if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
    commandLine "cmd", "/c", "gradlew.bat", "deploy", "-t"
  } else {
    commandLine "./gradlew", "deploy", "-t"
  }
}

tasks.register("npmBuild", NpmTask) {
  args = [
    "run",
    "--silent",
    "build"
  ]
  dependsOn npmInstall
  environment = [
    "FORCE_COLOR": "true",
    "LOG_LEVEL_FROM_GRADLE": gradle.startParameter.logLevel.toString(),
    "NODE_ENV": project.hasProperty("dev") || project.hasProperty("development") ? "development" : "production"
  ]
  inputs.dir "src/main/resources"
  outputs.dir "build/resources/main"
  outputs.upToDateWhen { false }
}

jar.dependsOn npmBuild

compileTestJava.dependsOn npmBuild

tasks.register("npmCheck", NpmTask) {
  dependsOn npmInstall
  args = [
    "run",
    "check"
  ]
  environment = [
    "FORCE_COLOR": "true",
  ]
}

check.dependsOn npmCheck

tasks.withType(Copy).configureEach {
  includeEmptyDirs = false
}

publishing {
  repositories {
    maven {
      name = "itemtestRepository"
      // Only stable versions reach the releases repository: a changesets prerelease (1.0.0-beta.0 on npm) is versioned
      // 1.0.0-SNAPSHOT here by .changeset/gradle-version.mjs
      url = version.endsWith("SNAPSHOT")
        ? "https://repo.itemtest.no/snapshots"
        : "https://repo.itemtest.no/releases"
      credentials(PasswordCredentials)
      authentication {
        basic(BasicAuthentication)
      }
    }
  }
  publications {
    mavenJava(MavenPublication) {
      from components.java
      groupId = project.group
      artifactId = projectName
      version = project.version
    }
  }
}
